name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # #打tag 时触发发布
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- 编译 + 测试 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # ---------- 发布二进制 ----------
  release:
    # 只在推送 tag（如 v1.0.0）时运行；如需 push main 也发布，可改成 always()
    if: startsWith(github.ref, 'refs/tags/v1.0.0')
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pssh-rs-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pssh-rs-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pssh-rs-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pssh-rs-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package binary
        shell: bash
        run: |
          BIN_NAME="pssh-rs"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          DEST="${{ matrix.artifact }}"
          cp "$SRC" "$DEST"
          # 可选：打包成 tar.gz / zip
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            powershell Compress-Archive -Path "$DEST" -DestinationPath "$DEST.zip"
            rm "$DEST"
          else
            tar -czf "$DEST.tar.gz" "$DEST"
            rm "$DEST"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  # ---------- 创建 GitHub Release 并上传产物 ----------
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要写权限才能创建 Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
